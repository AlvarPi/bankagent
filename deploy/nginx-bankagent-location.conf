# Lisa gfc.genofin.ee 443-serveriblokki (nt /banks/ bloki kõrvale).
# Iseseisev uus pangaeelvaade /home/agent/bankagent (user agent), port 5173.
    location /bankagent/ {
        proxy_pass http://127.0.0.1:5173/bankagent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 500s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 500s;

        # Nõustaja (📎 lisatud failid + ajalugu) — nginxi vaikepiir 1 MB on liiga väike,
        # rakenduse piir on 8 MB (MAX_BODY_BYTES serve-banks-preview.js-is).
        client_max_body_size 8m;
    }
