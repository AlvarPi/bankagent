# Lisa gfc.genofin.ee 443-serveriblokki (nt /banks/ bloki kõrvale).
# Iseseisev uus pangaeelvaade /home/agent/bankagent (user agent), port 5173.
    location /bankagent/ {
        proxy_pass http://127.0.0.1:5173/bankagent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 500s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 500s;

        # Failide üleslaadimine /bankagent/upload/ — nginxi vaikepiir on 1 MB,
        # rakenduse enda piir on 25 MB (MAX_UPLOAD_BYTES serve-banks-preview.js-is).
        client_max_body_size 25m;
        proxy_request_buffering off;
    }
